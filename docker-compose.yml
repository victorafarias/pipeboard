      - 0.0.0.0
      - --port
      - "8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tiktok-ads.rule=Host(`tiktok-ads.ovictorfarias.com.br`)"
      - "traefik.http.routers.tiktok-ads.entrypoints=websecure"
      - "traefik.http.routers.tiktok-ads.tls.certresolver=mytlschallenge"
      - "traefik.http.services.tiktok-ads.loadbalancer.server.port=8080"
    networks:
      - root_default
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('127.0.0.1',8080),2); s.close()\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  root_default:
    external: true
